<speed-dial
  icon="menu"
  icon-hover="download"
  tooltip="下载图片"
  [open-on-hover]="true"
  (main-click)="download()"
>
  <button mat-mini-fab matTooltip="分享图片" (click)="share()">
    <mat-icon fontSet="material-icons-outlined"> share </mat-icon>
  </button>
  <button mat-mini-fab matTooltip="自定义图片" (click)="customize()">
    <mat-icon fontSet="material-icons-outlined"> tune </mat-icon>
  </button>
  <button
    *ngIf="canManage"
    mat-mini-fab
    matTooltip="编辑图片"
    (click)="editImage()"
  >
    <mat-icon fontSet="material-icons-outlined"> edit </mat-icon>
  </button>
  <button
    *ngIf="canManage"
    mat-mini-fab
    matTooltip="删除图片"
    (click)="deleteImage()"
  >
    <mat-icon fontSet="material-icons-outlined"> delete </mat-icon>
  </button>
</speed-dial>
