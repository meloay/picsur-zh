<mat-progress-spinner *ngIf="images === null"></mat-progress-spinner>

<h2 class="text-center" *ngIf="images !== null && images.length <= 0">
  还没有图片，上传第一张吧
</h2>

<ng-container *ngIf="images !== null && images.length > 0">
  <h1>我的图片</h1>
  <masonry [columns]="columns">
    <ng-template *ngFor="let image of images" masonry-item>
      <div class="m-2">
        <mat-card>
          <mat-card-header>
            <mat-card-title>{{ image.file_name | truncate }}</mat-card-title>
            <mat-card-subtitle>
              上传于 {{ image.created | amTimeAgo }}
              {{
                image.expires_at === null
                  ? ''
                  : '| 到期时间 ' + (image.expires_at | amTimeAgo)
              }}
            </mat-card-subtitle>
          </mat-card-header>
          <picsur-img
            mat-card-image
            [src]="getThumbnailUrl(image)"
            alt="Image uploaded by you"
          >
          </picsur-img>
          <mat-card-actions>
            <button mat-stroked-button (click)="viewImage(image)">查看</button>
            <button mat-button color="warn" (click)="deleteImage(image)">
              删除
            </button>
          </mat-card-actions>
        </mat-card>
      </div>
    </ng-template>
  </masonry>

  <paginator
    [total-pages]="pages"
    [page]="page"
    (page)="gotoPage($event)"
  ></paginator>
</ng-container>
