<mat-nav-list>
  <ng-container *ngIf="personalRoutes.length > 0">
    <div mat-subheader>个人设置</div>
    <a
      *ngFor="let route of personalRoutes"
      mat-list-item
      [routerLink]="'/settings/' + route.path"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      <span class="nav-content">
        <mat-icon fontSet="material-icons-outlined" aria-hidden="true">
          {{ route.data?.page?.icon }}
        </mat-icon>
        <span class="nav-label">{{ route.data?.page?.title }}</span>
      </span>
    </a>
  </ng-container>

  <mat-divider *ngIf="systemRoutes.length > 0 && personalRoutes.length > 0">
  </mat-divider>

  <ng-container *ngIf="systemRoutes.length > 0">
    <div mat-subheader>系统</div>
    <a
      *ngFor="let route of systemRoutes"
      mat-list-item
      [routerLink]="'/settings/' + route.path"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      <span class="nav-content">
        <mat-icon fontSet="material-icons-outlined" aria-hidden="true">
          {{ route.data?.page?.icon }}
        </mat-icon>
        <span class="nav-label">{{ route.data?.page?.title }}</span>
      </span>
    </a>
  </ng-container>
</mat-nav-list>
