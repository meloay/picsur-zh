<button
  mat-icon-button
  aria-label="首页"
  (click)="changePage(1)"
  *ngIf="showFirstLast"
  [disabled]="page <= 1"
>
  <mat-icon>first_page</mat-icon>
</button>
<button
  mat-icon-button
  aria-label="上一页"
  (click)="changePage(page - 1)"
  [disabled]="page <= 1"
>
  <mat-icon>chevron_left</mat-icon>
</button>

<ng-container *ngIf="firstPagesRange !== null">
  <button
    mat-button
    class="page-number"
    [attr.aria-label]="'第 ' + i + ' 页'"
    (click)="changePage(i)"
    *ngFor="let i of firstPagesRange | range"
  >
    <span>{{ i }}</span>
  </button>

  <div class="paginator-filler">
    <span>...</span>
  </div>
</ng-container>

<button
  mat-button
  class="page-number"
  (click)="changePage(i)"
  [class.is-current]="i === page"
  [attr.aria-current]="i === page ? 'page' : null"
  [attr.aria-label]="'第 ' + i + ' 页'"
  *ngFor="let i of pagesRange | range"
>
  <span>{{ i }}</span>
</button>

<ng-container *ngIf="lastPagesRange !== null">
  <div class="paginator-filler">
    <span>...</span>
  </div>

  <button
    mat-button
    class="page-number"
    [attr.aria-label]="'第 ' + i + ' 页'"
    (click)="changePage(i)"
    *ngFor="let i of lastPagesRange | range"
  >
    <span>{{ i }}</span>
  </button>
</ng-container>

<button
  mat-icon-button
  aria-label="下一页"
  (click)="changePage(page + 1)"
  [disabled]="page >= totalPages"
>
  <mat-icon>chevron_right</mat-icon>
</button>
<button
  mat-icon-button
  aria-label="末页"
  (click)="changePage(totalPages)"
  *ngIf="showFirstLast"
  [disabled]="page >= totalPages"
>
  <mat-icon>last_page</mat-icon>
</button>
